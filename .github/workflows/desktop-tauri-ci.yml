name: desktop-tauri-ci

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-tauri-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tauri-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: desktop frontend (typecheck + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_DESKTOP: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci --prefix desktop
      - name: Typecheck
        run: npm run typecheck --prefix desktop
      - name: Build
        run: npm run build --prefix desktop

  tauri-check:
    name: tauri check (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VITE_DESKTOP: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps and build dist
        run: |
          npm ci --prefix desktop
          npm run build --prefix desktop
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Cargo check
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
