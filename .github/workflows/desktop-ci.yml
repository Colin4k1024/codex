name: desktop-ci

on:
  pull_request:
    paths:
      - desktop/**
      - codex-rs/app-server-protocol/**
      - .github/workflows/desktop-ci.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

jobs:
  protocol-drift:
    name: App-server protocol drift
    # Linux-only while hosted Actions billing is unavailable; #38 tracks the full matrix.
    runs-on: local-docker
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo-home
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run protocol fixture tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-app-server-protocol --lib schema_fixtures

  build-test:
    name: Desktop build and test
    # Linux-only while hosted Actions billing is unavailable; #38 tracks the full matrix.
    runs-on: local-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install desktop dependencies
        # The workspace contains an unrelated git-hosted package with an unreliable prepare script.
        # Desktop does not consume that package, so install without scripts and run Electron's installer explicitly.
        run: pnpm --filter codex-desktop... install --frozen-lockfile --ignore-scripts
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Check generated protocol revision
        run: pnpm --dir desktop/packages/app-server-protocol check
      - name: Build generated protocol package
        run: pnpm --dir desktop/packages/app-server-protocol build
      - name: Test generated protocol package
        run: pnpm --dir desktop/packages/app-server-protocol test
      - name: Format
        run: pnpm --dir desktop format
      - name: Lint
        run: pnpm --dir desktop lint
      - name: Typecheck
        run: pnpm --dir desktop typecheck
      - name: Unit tests
        run: pnpm --dir desktop test
      - name: Build
        run: pnpm --dir desktop build
      - name: Electron smoke
        shell: bash
        run: |
          export ELECTRON_DISABLE_SANDBOX=1
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm --dir desktop test:electron
