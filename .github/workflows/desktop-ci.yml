name: codex-opencode-adapter-ci

on:
  pull_request:
    paths:
      - codex-opencode-adapter/**
      - codex-rs/app-server-protocol/**
      - .github/workflows/desktop-ci.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

jobs:
  protocol-drift:
    name: App-server protocol drift
    # Linux-only while hosted Actions billing is unavailable; #38 tracks the full matrix.
    runs-on: local-docker
    env:
      no_proxy: '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        # 1.95.0 fails on this ARM64 runner with E0463 dependency-resolution errors.
        uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - name: Run protocol fixture tests
        working-directory: codex-rs
        env:
          CARGO_HOME: /tmp/codex-cargo-home
          CARGO_TARGET_DIR: /tmp/codex-cargo-target
        run: cargo test --locked -p codex-app-server-protocol --lib schema_fixtures

  adapter-build:
    name: Codex OpenCode adapter build and test
    runs-on: local-docker
    env:
      no_proxy: '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        env:
          npm_config_store_dir: /tmp/codex-pnpm-store-${{ github.run_id }}
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_store_dir: /tmp/codex-pnpm-store-${{ github.run_id }}
          npm_config_registry: https://registry.npmmirror.com
        run: pnpm --filter codex-opencode-adapter install --frozen-lockfile --network-concurrency 4
      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Build adapter
        run: pnpm --dir codex-opencode-adapter build