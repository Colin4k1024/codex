name: desktop-ci

on:
  pull_request:
    paths:
      - desktop/**
      - codex-rs/app-server-protocol/**
      - .github/workflows/desktop-ci.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

jobs:
  protocol-drift:
    name: App-server protocol drift
    # Linux-only while hosted Actions billing is unavailable; #38 tracks the full matrix.
    runs-on: local-docker
    env:
      no_proxy: '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        # 1.95.0 fails on this ARM64 runner with E0463 dependency-resolution errors.
        uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - name: Run protocol fixture tests
        working-directory: codex-rs
        env:
          CARGO_HOME: /tmp/codex-cargo-home
          CARGO_TARGET_DIR: /tmp/codex-cargo-target
        run: cargo test --locked -p codex-app-server-protocol --lib schema_fixtures

  build-test:
    name: Desktop build and test
    # Linux-only while hosted Actions billing is unavailable; #38 tracks the full matrix.
    runs-on: local-docker
    env:
      no_proxy: '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        env:
          npm_config_store_dir: /tmp/codex-pnpm-store-${{ github.run_id }}
        with:
          node-version: 22
          cache: pnpm
      - name: Install desktop dependencies
        # The workspace contains an unrelated git-hosted package with an unreliable prepare script.
        # Desktop does not consume that package, so install without scripts and run Electron's installer explicitly.
        # A job-local overlay-filesystem store avoids concurrent runner corruption and grpcfuse file errors;
        # lower network concurrency avoids registry resets.
        env:
          npm_config_store_dir: /tmp/codex-pnpm-store-${{ github.run_id }}
          npm_config_registry: https://registry.npmmirror.com
        run: pnpm --filter codex-desktop... install --frozen-lockfile --ignore-scripts --network-concurrency 4
      - name: Install Electron binary
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node node_modules/electron/install.js
      - name: Check generated protocol revision
        run: pnpm --dir desktop/packages/app-server-protocol check
      - name: Build generated protocol package
        run: pnpm --dir desktop/packages/app-server-protocol build
      - name: Test generated protocol package
        run: pnpm --dir desktop/packages/app-server-protocol test
      - name: Format
        run: pnpm --dir desktop format
      - name: Lint
        run: pnpm --dir desktop lint
      - name: Typecheck
        run: pnpm --dir desktop typecheck
      - name: Unit tests
        run: pnpm --dir desktop test
      - name: Install Electron runtime libraries
        # The secure local Docker runner is minimal; install Chromium/Electron's
        # shared libraries inside the container, never on the host.
        run: |
          sed -i 's|http://ports.ubuntu.com/ubuntu-ports/|https://mirrors.aliyun.com/ubuntu-ports/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgtk-3-0 libgbm1 libasound2t64 libxss1 libxtst6 libxrandr2 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libpango-1.0-0 libcairo2
      - name: Build
        run: pnpm --dir desktop build
      - name: Electron smoke
        shell: bash
        run: |
          export ELECTRON_DISABLE_SANDBOX=1
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm --dir desktop test:electron
