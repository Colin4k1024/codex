# P0-2c V1 overlay: leader on gpt-5.6-luna (multiAgentVersion v1) + collab tools (default on),
# multi_agent_v2 feature absent (default off) -> V1 tool set incl. close_agent/resume_agent.
approval_policy = "never"
sandbox_mode = "workspace-write"
model = "gpt-5.6-luna"

[agents]
enabled = true
max_concurrent_threads_per_session = 4