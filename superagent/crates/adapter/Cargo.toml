[package]
name = "superagent-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SuperAgent stdio adapter (P2-2 / #79): sole protocol boundary to the app-server engine. argv-array spawn, JSONL frame metering, three-way event pump, typed approvals (never auto-approve), resource limits, per-type timeouts, crash reconciliation. Model-free fault-injection tests."

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"