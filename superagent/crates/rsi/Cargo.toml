[package]
name = "superagent-rsi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SuperAgent P3-3 RSI closed loop v1: candidate -> fixed-fixture eval -> human approval -> digest-pinned promote -> rollback; unapproved experience never enters prompt; privilege-escalation rejected"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superagent-marketplace = { path = "../marketplace" }