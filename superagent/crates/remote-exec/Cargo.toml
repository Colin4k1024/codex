[package]
name = "superagent-remote-exec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SuperAgent P5-1 remote tool execution: authenticated exec-server connection, environment bootstrap, capability discovery + permission boundary wired into the orchestrator NodeExecutor"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
superagent-orchestrator = { path = "../orchestrator" }
superagent-contracts = { path = "../contracts" }

[dev-dependencies]
superagent-storage = { path = "../storage" }