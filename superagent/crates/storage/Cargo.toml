[package]
name = "superagent-storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SuperAgent independent state store (P2-3 / #80): SQLite migrations, exclusive run leases, transactional intent persistence + external-ID binding, auto-increment event sequence for UI replay, bounded summaries. No engine rollout schema mixing, no process/model execution."

[workspace]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superagent-contracts = { path = "../contracts" }

[dev-dependencies]
tempfile = "3"