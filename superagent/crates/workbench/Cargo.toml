[package]
name = "superagent-workbench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SuperAgent P5-5 dev workbench: workflow canvas (nodes/edges/gates/artifacts) -> workflow JSON validated by #78 contracts and executable by #81 orchestrator; minimal tenant Application Space resource view"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superagent-contracts = { path = "../contracts" }

[dev-dependencies]
superagent-orchestrator = { path = "../orchestrator" }
superagent-storage = { path = "../storage" }